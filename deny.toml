[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-pc-windows-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  # File-level copyleft, used unmodified by Tauri dependencies.
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
