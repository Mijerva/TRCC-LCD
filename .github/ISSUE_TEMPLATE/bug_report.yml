name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: device
    attributes:
      label: Cooler model and USB ID
      placeholder: Peerless Vision 360, 87AD:70DB
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: Remove usernames, file paths and serial numbers before pasting.
      render: text
