[package]
name = "trcc-tray"
description = "Tray app that keeps a picture on Thermalright AIO LCD screens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
tray-icon = "0.24.2"
trcc-core = { version = "0.1.0", path = "../trcc-core" }
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[lints]
workspace = true

[[bin]]
name = "trcc-lcd-tray"
path = "src/main.rs"
